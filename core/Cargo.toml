[package]
name = "espanso-keyboard-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Espanso snippet expansion for an iPhone keyboard extension"
publish = false

[lib]
name = "espanso_keyboard_core"
crate-type = ["staticlib", "rlib"]

# Espanso's own libraries, pinned to one upstream commit so updates are deliberate.
# Bump all three together; see docs/plan.md, "Updating Espanso".
[dependencies]
espanso-config = { git = "https://github.com/espanso/espanso", rev = "80d9e35" }
espanso-match = { git = "https://github.com/espanso/espanso", rev = "80d9e35" }
espanso-render = { git = "https://github.com/espanso/espanso", rev = "80d9e35" }
anyhow = "1"
self_cell = "1"
unicode-segmentation = "1"
log = "0.4"
thiserror = "2.0.21"
uniffi = { version = "0.32", default-features = false }
regex = "1"

[features]
# Builds the uniffi-bindgen tool (scripts/build-xcframework.sh); not needed by the library.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
chrono = "0.4"
