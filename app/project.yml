name: HexKeyboard
options:
  bundleIdPrefix: com.shahidy.hexkeyboard
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The Rust core is built for Apple silicon Simulators only (espanso-keyboard).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  HexKeyboard:
    path: Packages/HexKeyboard
  # The Rust core; run scripts/build-xcframework.sh first (espanso-keyboard).
  EspansoKeyboardCore:
    path: ../swift/EspansoKeyboardCore
targets:
  Hex:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: Keyboard
      - package: HexKeyboard
        product: KeyboardUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Hex.entitlements
        PRODUCT_NAME: Hex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The script below edits the copied Settings.bundle, which a sandboxed script can't.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Set the App Group in Settings.bundle
        script: |
          /usr/libexec/PlistBuddy -c "Set :ApplicationGroupContainerIdentifier $APP_GROUP_ID" "$SCRIPT_INPUT_FILE_0"
          touch "$SCRIPT_OUTPUT_FILE_0"
        # The input orders the script after the resource copy; the output is only a stamp.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Settings.bundle/Root.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/settings-app-group.stamp
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HexAppGroup: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [hexkeyboard]
        NSMicrophoneUsageDescription: Hex listens when you pick Voice on the keyboard, and turns what you say into text on your iPhone.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      # Test snippets until the companion app copies the owner's folder (plan step 5).
      - path: ../fixtures/espanso
        type: folder
        buildPhase: resources
    dependencies:
      - package: HexKeyboard
        product: KeyboardUI
      - package: EspansoKeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        PRODUCT_NAME: Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Hex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HexAppGroup: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  HexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Hex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hex
        SWIFT_OBJC_BRIDGING_HEADER: UITests/EventSynthesis.h
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Hex:
    build:
      targets:
        Hex: all
        Keyboard: all
    run:
      config: Release
    test:
      config: Debug
      targets: [HexUITests]
